<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 960" width="1180" height="960" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E65100"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker>
  </defs>

  <rect width="1180" height="960" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#232F3E">Onward Logistics order system: secure multi-AZ network</text>
  <text x="20" y="46" fill="#546E7A">Jordan Nguepi · Designing a Secure Network for Onward Logistics Order System · deployed with CloudFormation Git sync</text>

  <!-- External actors -->
  <rect x="380" y="58" width="140" height="40" rx="6" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="450" y="76" text-anchor="middle" font-weight="bold">Merchants &amp; customers</text>
  <text x="450" y="91" text-anchor="middle" fill="#546E7A">browser · HTTP :80</text>

  <rect x="880" y="58" width="120" height="40" rx="6" fill="#F3E5F5" stroke="#7B1FA2"/>
  <text x="940" y="76" text-anchor="middle" font-weight="bold">Engineers</text>
  <text x="940" y="91" text-anchor="middle" fill="#546E7A">IAM users</text>

  <rect x="1030" y="58" width="130" height="40" rx="6" fill="#ECEFF1" stroke="#546E7A"/>
  <text x="1095" y="76" text-anchor="middle" font-weight="bold">GitHub repo</text>
  <text x="1095" y="91" text-anchor="middle" fill="#546E7A">main branch</text>

  <!-- AWS Cloud / Region -->
  <rect x="20" y="112" width="1150" height="835" rx="4" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <text x="32" y="130" font-weight="bold" fill="#232F3E">AWS Cloud</text>
  <rect x="35" y="140" width="1120" height="795" rx="4" fill="none" stroke="#00A4A6" stroke-dasharray="6 4"/>
  <text x="47" y="158" font-weight="bold" fill="#00A4A6">Region eu-central-1 (Frankfurt)</text>

  <!-- VPC -->
  <rect x="55" y="190" width="790" height="730" rx="4" fill="#FBF8FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="67" y="208" font-weight="bold" fill="#8C4FFF">VPC onward-orders-dev-vpc · 10.0.0.0/16</text>

  <!-- Availability Zones -->
  <rect x="75" y="230" width="365" height="610" rx="4" fill="none" stroke="#147EBA" stroke-dasharray="5 4"/>
  <text x="87" y="248" font-weight="bold" fill="#147EBA">Availability Zone eu-central-1a</text>
  <rect x="460" y="230" width="365" height="610" rx="4" fill="none" stroke="#147EBA" stroke-dasharray="5 4"/>
  <text x="472" y="248" font-weight="bold" fill="#147EBA">Availability Zone eu-central-1b</text>

  <!-- Public subnets -->
  <rect x="90" y="262" width="335" height="150" rx="3" fill="#F2F8E6" stroke="#7AA116"/>
  <text x="100" y="278" font-weight="bold" fill="#5A7A10">public-a (public) · 10.0.0.0/24</text>
  <text x="100" y="404" font-size="10.5" fill="#5A7A10">public-rt: 0.0.0.0/0 → Internet Gateway</text>
  <rect x="475" y="262" width="335" height="150" rx="3" fill="#F2F8E6" stroke="#7AA116"/>
  <text x="485" y="278" font-weight="bold" fill="#5A7A10">public-b (public) · 10.0.1.0/24</text>
  <text x="485" y="404" font-size="10.5" fill="#5A7A10">public-rt: 0.0.0.0/0 → Internet Gateway</text>

  <!-- Web subnets -->
  <rect x="90" y="430" width="335" height="170" rx="3" fill="#E6F6F7" stroke="#00A4A6"/>
  <text x="100" y="446" font-weight="bold" fill="#007A7C">web-a (private) · 10.0.10.0/24</text>
  <text x="100" y="592" font-size="10.5" fill="#007A7C">private-rt-a: 0.0.0.0/0 → NAT Gateway A</text>
  <rect x="475" y="430" width="335" height="170" rx="3" fill="#E6F6F7" stroke="#00A4A6"/>
  <text x="485" y="446" font-weight="bold" fill="#007A7C">web-b (private) · 10.0.11.0/24</text>
  <text x="485" y="592" font-size="10.5" fill="#007A7C">private-rt-b: 0.0.0.0/0 → NAT Gateway B</text>

  <!-- App subnets -->
  <rect x="90" y="618" width="335" height="150" rx="3" fill="#E6F6F7" stroke="#00A4A6"/>
  <text x="100" y="634" font-weight="bold" fill="#007A7C">app-a (private) · 10.0.20.0/24</text>
  <text x="100" y="760" font-size="10.5" fill="#007A7C">private-rt-a: 0.0.0.0/0 → NAT Gateway A</text>
  <rect x="475" y="618" width="335" height="150" rx="3" fill="#E6F6F7" stroke="#00A4A6"/>
  <text x="485" y="634" font-weight="bold" fill="#007A7C">app-b (private) · 10.0.21.0/24</text>
  <text x="485" y="760" font-size="10.5" fill="#007A7C">private-rt-b: 0.0.0.0/0 → NAT Gateway B</text>

  <!-- Orange: outbound-only paths (drawn first so boxes sit on top) -->
  <g stroke="#E65100" stroke-width="1.6" fill="none" stroke-dasharray="6 4">
    <path d="M200,680 H110 V375 H128" marker-end="url(#o)"/>
    <path d="M200,525 H110"/>
    <path d="M585,680 H495 V375 H513" marker-end="url(#o)"/>
    <path d="M585,525 H495"/>
    <path d="M155,355 V289 H385 V196 H398" marker-end="url(#o)"/>
    <path d="M640,355 V289 H515 V196 H502" marker-end="url(#o)"/>
  </g>

  <!-- Internet Gateway -->
  <rect x="400" y="174" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="450" y="192" text-anchor="middle" font-weight="bold">Internet</text>
  <text x="450" y="207" text-anchor="middle" font-weight="bold">Gateway</text>

  <!-- ALB spanning both public subnets -->
  <rect x="235" y="300" width="430" height="44" rx="6" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="450" y="318" text-anchor="middle" font-weight="bold">Application Load Balancer (internet-facing)</text>
  <text x="450" y="334" text-anchor="middle" fill="#546E7A">one node in each AZ · health checks · alb-sg</text>

  <!-- NAT Gateways -->
  <rect x="130" y="355" width="150" height="40" rx="6" fill="#F3EDFF" stroke="#8C4FFF"/>
  <text x="205" y="372" text-anchor="middle" font-weight="bold">NAT Gateway A</text>
  <text x="205" y="387" text-anchor="middle" fill="#546E7A">+ Elastic IP</text>
  <rect x="515" y="355" width="150" height="40" rx="6" fill="#F3EDFF" stroke="#8C4FFF"/>
  <text x="590" y="372" text-anchor="middle" font-weight="bold">NAT Gateway B</text>
  <text x="590" y="387" text-anchor="middle" fill="#546E7A">+ Elastic IP</text>

  <!-- Auto Scaling Group spanning both web subnets -->
  <rect x="140" y="458" width="620" height="112" rx="6" fill="none" stroke="#ED7100" stroke-dasharray="7 4" stroke-width="1.4"/>
  <text x="540" y="480" text-anchor="middle" font-weight="bold" fill="#B85400">Auto Scaling Group (web-asg) · min 2 / max 4</text>

  <!-- Front-end EC2 -->
  <rect x="200" y="492" width="170" height="64" rx="6" fill="#FFF3E0" stroke="#ED7100"/>
  <text x="285" y="511" text-anchor="middle" font-weight="bold">Front-end EC2</text>
  <text x="285" y="527" text-anchor="middle" fill="#546E7A">AL2023 · t3.micro · Apache</text>
  <text x="285" y="543" text-anchor="middle" fill="#546E7A">web-sg · no public IP</text>
  <rect x="585" y="492" width="170" height="64" rx="6" fill="#FFF3E0" stroke="#ED7100"/>
  <text x="670" y="511" text-anchor="middle" font-weight="bold">Front-end EC2</text>
  <text x="670" y="527" text-anchor="middle" fill="#546E7A">AL2023 · t3.micro · Apache</text>
  <text x="670" y="543" text-anchor="middle" fill="#546E7A">web-sg · no public IP</text>

  <!-- Order service EC2 -->
  <rect x="200" y="648" width="170" height="64" rx="6" fill="#FFF3E0" stroke="#ED7100"/>
  <text x="285" y="667" text-anchor="middle" font-weight="bold">Order service EC2</text>
  <text x="285" y="683" text-anchor="middle" fill="#546E7A">AL2023 · t3.micro · :8080</text>
  <text x="285" y="699" text-anchor="middle" fill="#546E7A">app-sg · no public IP</text>
  <rect x="585" y="648" width="170" height="64" rx="6" fill="#FFF3E0" stroke="#ED7100"/>
  <text x="670" y="667" text-anchor="middle" font-weight="bold">Order service EC2</text>
  <text x="670" y="683" text-anchor="middle" fill="#546E7A">AL2023 · t3.micro · :8080</text>
  <text x="670" y="699" text-anchor="middle" fill="#546E7A">app-sg · no public IP</text>

  <!-- S3 gateway endpoint -->
  <rect x="330" y="858" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#7AA116" stroke-width="1.5"/>
  <text x="450" y="876" text-anchor="middle" font-weight="bold">S3 Gateway Endpoint</text>
  <text x="450" y="892" text-anchor="middle" fill="#546E7A">on both private route tables · free</text>

  <!-- Green: inbound customer traffic -->
  <g stroke="#2E7D32" stroke-width="2" fill="none">
    <path d="M450,98 V172" marker-end="url(#g)"/>
    <path d="M450,218 V298" marker-end="url(#g)"/>
    <path d="M345,344 V490" marker-end="url(#g)"/>
    <path d="M640,344 V421 H730 V490" marker-end="url(#g)"/>
  </g>
  <text x="353" y="424" fill="#2E7D32" font-weight="bold">:80</text>
  <text x="738" y="457" fill="#2E7D32" font-weight="bold">:80</text>

  <!-- Blue: front end to order service -->
  <g stroke="#1565C0" stroke-width="2" fill="none">
    <path d="M345,556 V646" marker-end="url(#b)"/>
    <path d="M730,556 V646" marker-end="url(#b)"/>
  </g>
  <text x="353" y="612" fill="#1565C0" font-weight="bold">:8080</text>
  <text x="690" y="612" fill="#1565C0" font-weight="bold">:8080</text>

  <!-- Right column -->
  <rect x="870" y="200" width="270" height="56" rx="6" fill="#F3E5F5" stroke="#7B1FA2"/>
  <text x="1005" y="222" text-anchor="middle" font-weight="bold">Systems Manager · Session Manager</text>
  <text x="1005" y="240" text-anchor="middle" fill="#546E7A">shell access · no SSH, no keys</text>

  <rect x="870" y="272" width="270" height="56" rx="6" fill="#ECEFF1" stroke="#546E7A"/>
  <text x="1005" y="294" text-anchor="middle" font-weight="bold">CloudFormation + Git sync</text>
  <text x="1005" y="312" text-anchor="middle" fill="#546E7A">stack onward-orders-dev-network</text>

  <rect x="870" y="344" width="270" height="56" rx="6" fill="#FFF8E1" stroke="#C99A00"/>
  <text x="1005" y="366" text-anchor="middle" font-weight="bold">IAM role ec2-ssm-role</text>
  <text x="1005" y="384" text-anchor="middle" fill="#546E7A">AmazonSSMManagedInstanceCore · all EC2</text>

  <!-- Purple: admin path; grey: deployment -->
  <path d="M940,98 V198" stroke="#7B1FA2" stroke-width="1.8" fill="none" stroke-dasharray="2 4" marker-end="url(#p)"/>
  <path d="M868,228 H770 V492" stroke="#7B1FA2" stroke-width="1.8" fill="none" stroke-dasharray="2 4" marker-end="url(#p)"/>
  <path d="M770,570 V648" stroke="#7B1FA2" stroke-width="1.8" fill="none" stroke-dasharray="2 4" marker-end="url(#p)"/>
  <text x="776" y="606" fill="#7B1FA2" font-size="10.5">SSM agent</text>
  <text x="776" y="619" fill="#7B1FA2" font-size="10.5">443 out</text>
  <path d="M1095,98 V270" stroke="#546E7A" stroke-width="1.6" fill="none" marker-end="url(#k)"/>
  <path d="M868,300 H847" stroke="#546E7A" stroke-width="1.6" fill="none" marker-end="url(#k)"/>

  <!-- Amazon S3 -->
  <rect x="870" y="858" width="270" height="44" rx="6" fill="#F2F8E6" stroke="#7AA116"/>
  <text x="1005" y="876" text-anchor="middle" font-weight="bold">Amazon S3</text>
  <text x="1005" y="892" text-anchor="middle" fill="#546E7A">Amazon Linux package repositories</text>
  <path d="M572,880 H868" stroke="#7AA116" stroke-width="1.8" fill="none" marker-end="url(#g)"/>

  <!-- Security groups -->
  <rect x="870" y="420" width="270" height="140" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-dasharray="5 3"/>
  <text x="882" y="440" font-weight="bold" fill="#C62828">Security groups (no port 22 anywhere)</text>
  <text x="882" y="462" font-weight="bold">alb-sg</text><text x="940" y="462">in 80 from 0.0.0.0/0</text>
  <text x="940" y="477">out 80 to web-sg</text>
  <text x="882" y="499" font-weight="bold">web-sg</text><text x="940" y="499">in 80 from alb-sg only</text>
  <text x="940" y="514">out 8080 to app-sg, 443/80</text>
  <text x="882" y="536" font-weight="bold">app-sg</text><text x="940" y="536">in 8080 from web-sg only</text>
  <text x="940" y="551">out 443/80 (via NAT)</text>

  <!-- Legend -->
  <rect x="870" y="578" width="270" height="138" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="882" y="598" font-weight="bold">Legend</text>
  <line x1="882" y1="616" x2="922" y2="616" stroke="#2E7D32" stroke-width="2"/><text x="932" y="620">Customer traffic (inbound)</text>
  <line x1="882" y1="638" x2="922" y2="638" stroke="#1565C0" stroke-width="2"/><text x="932" y="642">Front end → order service</text>
  <line x1="882" y1="660" x2="922" y2="660" stroke="#E65100" stroke-width="1.6" stroke-dasharray="6 4"/><text x="932" y="664">Outbound only, via own-AZ NAT</text>
  <line x1="882" y1="682" x2="922" y2="682" stroke="#7B1FA2" stroke-width="1.8" stroke-dasharray="2 4"/><text x="932" y="686">Admin via Session Manager</text>
  <line x1="882" y1="704" x2="922" y2="704" stroke="#546E7A" stroke-width="1.6"/><text x="932" y="708">Deployment (Git sync)</text>

  <!-- Cost note -->
  <rect x="870" y="732" width="270" height="108" rx="6" fill="#FAFAFA" stroke="#B0BEC5"/>
  <text x="882" y="752" font-weight="bold">Approx. monthly cost (eu-central-1)</text>
  <text x="882" y="772">NAT Gateways ×2</text><text x="1128" y="772" text-anchor="end">~$76</text>
  <text x="882" y="789">Load balancer</text><text x="1128" y="789" text-anchor="end">~$27</text>
  <text x="882" y="806">EC2 ×4 + EBS</text><text x="1128" y="806" text-anchor="end">~$38</text>
  <text x="882" y="823">Public IPv4 ×4</text><text x="1128" y="823" text-anchor="end">~$15</text>
  <text x="882" y="834" font-size="10" fill="#546E7A">Total ≈ $150/month before Free Tier</text>
</svg>
