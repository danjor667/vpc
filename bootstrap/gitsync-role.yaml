AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time bootstrap for CloudFormation Git sync - the IAM role Git sync assumes
  to deploy templates/network.yaml. Customer managed policies only (no inline policies).

Parameters:
  ProjectName:
    Type: String
    Default: onward-orders
  Environment:
    Type: String
    Default: dev
  OwnerName:
    Type: String
    MinLength: 1
  CostCenter:
    Type: String
    Default: logistics

Resources:
  # Permissions Git sync itself needs to drive the stack (per the AWS Git sync docs).
  GitSyncPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-gitsync-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SyncToCloudFormation
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: "*"
          - Sid: PolicyForManagedRules
            Effect: Allow
            Action: [events:PutRule, events:PutTargets]
            Resource: "*"
            Condition:
              StringEquals:
                events:ManagedBy: cloudformation.sync.codeconnections.amazonaws.com
          - Sid: PolicyForDescribingRule
            Effect: Allow
            Action: events:DescribeRule
            Resource: "*"

  # Permissions CloudFormation needs to create the resources in templates/network.yaml.
  StackResourcesPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-gitsync-resources-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NetworkAndCompute
            Effect: Allow
            Action:
              - ec2:*
              - elasticloadbalancing:*
              - autoscaling:*
            Resource: "*"
          - Sid: ResolveAmiParameter
            Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters]
            Resource: !Sub "arn:${AWS::Partition}:ssm:*:*:parameter/aws/service/*"
          - Sid: ProjectIamRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PassRole
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${ProjectName}-${Environment}-*"
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - autoscaling.amazonaws.com
                  - elasticloadbalancing.amazonaws.com

  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-gitsync-role"
      Description: Assumed by CloudFormation Git sync to deploy the network stack
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.sync.codeconnections.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref GitSyncPolicy
        - !Ref StackResourcesPolicy
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-gitsync-role" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref OwnerName }
        - { Key: CostCenter, Value: !Ref CostCenter }

Outputs:
  GitSyncRoleArn:
    Value: !GetAtt GitSyncRole.Arn
